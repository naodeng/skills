schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/create-complete-plan-project.yaml
    - evals/cases/handle-incomplete-input.yaml
    - evals/cases/preserve-existing-project-scope.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 20
    expect:
      exit_code: 0

report:
  formats: [json, html]
